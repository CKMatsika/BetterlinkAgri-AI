name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  pest-postgres:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_DB: betterlink_agr_ai
          POSTGRES_USER: betterlink
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U betterlink -d betterlink_agr_ai"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostGIS in Postgres service
        run: |
          docker ps --filter "publish=5432" -q | xargs -I {} docker exec {} bash -c "apt-get update && apt-get install -y --no-install-recommends postgresql-16-postgis-3 && rm -rf /var/lib/apt/lists/*"

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_pgsql, pgsql, pdo_sqlite, redis, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run full Pest suite on PostgreSQL + PostGIS + pgvector
        run: php vendor/bin/pest -c phpunit.pgsql.xml --exclude-group=live-only
