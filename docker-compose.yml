services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: betterlink_app
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - betterlink_net

  nginx:
    image: nginx:1.27-alpine
    container_name: betterlink_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - betterlink_net

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: betterlink_horizon
    restart: unless-stopped
    command: php artisan horizon
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - betterlink_net

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: betterlink_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - betterlink_net

  postgres:
    image: postgis/postgis:16-3.4
    container_name: betterlink_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-betterlink_agr_ai}
      POSTGRES_USER: ${DB_USERNAME:-betterlink}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-betterlink} -d ${DB_DATABASE:-betterlink_agr_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - betterlink_net

  redis:
    image: redis:7.4-alpine
    container_name: betterlink_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - betterlink_net

networks:
  betterlink_net:
    driver: bridge

volumes:
  pgdata:
